version: 2

sources:
  - name: raw
    schema: raw
    description: Source CSVs as text, appended by `dbt run-operation load_raw`.
    tables:
      - name: payments
        data_tests:
          - no_conflicting_versions:
              arguments:
                version_at: cast(coalesce(updated_at, created_at) as timestamptz)
      - name: receipts
        data_tests:
          - no_conflicting_versions:
              arguments:
                version_at: cast(created_at as timestamptz)
      - name: disbursements
        data_tests:
          - no_conflicting_versions:
              arguments:
                version_at: cast(coalesce(updated_at, created_at) as timestamptz)
