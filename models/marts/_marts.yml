version: 2

models:
  - name: fct_remittances
    description: One row per payment, including payments with no receipt. Owns payout outcome, money measures, and eligibility flags. `transacted_usd` is null unless the payment is a delivered remittance.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: payout_outcome
        data_tests:
          - accepted_values:
              arguments:
                values: [no_receipt, multiple_delivered, delivered, in_flight, missing_payout, not_delivered]

  - name: dim_users
    description: One row per user with a payment. Owns volume class, recurring status, repeat within the window, and beneficiary segment.
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: volume_class
        data_tests:
          - accepted_values:
              arguments:
                values: [top_50_pct_volume, long_tail, no_delivered_volume]

  - name: mart_user_segments
    description: |
      Users and volume by class and segment. Each segment type adds up to all users.
      Decision: concentration, retention, and recipient patterns at a glance.
      Definition: `top_50_pct_volume` is the top 50% of extract volume, including the user who crosses 50%. Recurring means two consecutive delivered remittances more than 1 day apart and within `recurring_window_days`. Beneficiary segments count first observed attempts.
      Excludes: nothing. Users with no delivered remittance have their own segment.
      Limitation: the top group isn't a stable VIP list, because few users stay in a month's top group.
    meta: {requirement: [R7, R8, R10], assumptions: [A5, A6, A7]}
    data_tests:
      - unique:
          arguments:
            column_name: "segment_type || '|' || segment"

  - name: mart_recurring_cohorts
    description: |
      Recurring share and repeat rate by first delivered month.
      Decision: compare retention across cohorts.
      Definition: `recurring_share` uses the recurring rule. `repeat_rate` is the share with another delivered remittance from over 1 day to `recurring_window_days` after the first send, among users with a full window.
      Excludes: users with no delivered remittance.
      Limitation: recent cohorts have had less time to become recurring, so compare them with `repeat_rate`. Activity before January 2026 isn't visible.
    meta: {requirement: R8, assumptions: [A5]}
    columns:
      - name: first_delivered_month
        data_tests: [unique, not_null]

  - name: mart_monthly_volume
    description: |
      Delivered volume by UTC month of the payment, with concentration and sender counts.
      Decision: growth tracking, and a shared baseline for finance and leadership.
      Definition: `transacted_usd` is the customer-paid amount on delivered remittances. `top_50_pct_user_share` is the share of a month's senders who make 50% of that month's volume.
      Excludes: failed, refunded, in-flight, and no-receipt payments. `all_successful_payments_usd` shows the wider total.
      Limitation: September is partial. All January senders count as first seen because earlier activity isn't visible, so the returning share rises partly by construction.
    meta: {requirement: R6, assumptions: [A1, A2, A3, A4, A12]}
    columns:
      - name: payment_month
        data_tests: [unique, not_null]

  - name: mart_chargeback_rate
    description: |
      Chargeback rates by payment month, on settled payments.
      Decision: card-processing risk and fraud controls.
      Definition: flagged payments divided by `SUCCESSFUL` and `REFUNDED` payments, by count and by payment value. A flag means a dispute was raised, whatever the outcome.
      Excludes: payments that were never settled.
      Limitation: the data has no dispute date or outcome. This is a cohort rate by payment month, and recent months are low because disputes arrive late, so read `is_mature` first.
    meta: {requirement: R11, assumptions: [A10, A11]}
    columns:
      - name: payment_month
        data_tests: [unique, not_null]

  - name: mart_provider_failures
    description: |
      Failure rates and classes by payout provider, at the attempt grain.
      Decision: routing, vendor management, and customer experience.
      Definition: `failed_rate` is failed over delivered plus failed. `unsuccessful_terminal_rate` adds cancellations to both sides, and counts outcomes without assigning fault. `failure_class` uses the first rate, and `unsuccessful_class` uses the second, with the thresholds in `provider_class`.
      Excludes: missing attempts, which have no provider, and in-flight attempts from the rates.
      Limitation: rates aren't adjusted for country or payout mix. `failed` and `cancelled` aren't comparable across providers, so read `is_label_sensitive`. Providers 5 and 7 sit within sampling noise of the 3% line.
    meta: {requirement: R9, assumptions: [A8, A9]}
    columns:
      - name: provider
        data_tests: [unique, not_null]

  - name: mart_shared_beneficiaries
    description: |
      Beneficiaries used by more than one user, across all observed attempts.
      Decision: fraud and network review, and household insight.
      Definition: a `beneficiary_key` with more than 1 distinct user.
      Excludes: nothing. Proxy links through payer or amount aren't used, because they would invent connections.
      Limitation: it's empty on this extract, because `beneficiary_id` behaves like a sender's saved recipient record. A global key would fill it with no SQL change.
    meta: {requirement: R10, assumptions: [A7]}
    columns:
      - name: beneficiary_key
        data_tests: [unique, not_null]

unit_tests:
  - name: money_counts_once_and_payments_survive
    model: fct_remittances
    overrides:
      vars:
        transacted_measure: customer_paid_usd
    given:
      - input: ref('stg_payments')
        rows:
          - {payment_id: two_delivered, payment_status: SUCCESSFUL, amount_usd: 103.00, created_at: '2026-01-01 00:00:00+00'}
          - {payment_id: no_receipt, payment_status: SUCCESSFUL, amount_usd: 1.00, created_at: '2026-01-02 00:00:00+00'}
          - {payment_id: failed_paid_out, payment_status: FAILED, amount_usd: 50.00, created_at: '2026-01-03 00:00:00+00'}
          - {payment_id: in_flight_beats_missing, payment_status: SUCCESSFUL, amount_usd: 5.00, created_at: '2026-01-03 00:00:00+00'}
          - {payment_id: missing_beats_failed, payment_status: SUCCESSFUL, amount_usd: 5.00, created_at: '2026-01-03 00:00:00+00'}
          - {payment_id: all_failed, payment_status: SUCCESSFUL, amount_usd: 5.00, created_at: '2026-01-03 00:00:00+00'}
      - input: ref('int_payout_attempts')
        rows:
          - {payment_id: two_delivered, attempt_status: delivered, is_primary_attempt: true, amount_charged_usd: 100.00, promotion_usd: 0.00, fee_usd: 3.00}
          - {payment_id: two_delivered, attempt_status: delivered, is_primary_attempt: false, amount_charged_usd: 100.00, promotion_usd: 0.00, fee_usd: 3.00}
          - {payment_id: failed_paid_out, attempt_status: delivered, is_primary_attempt: true, amount_charged_usd: 47.00, promotion_usd: 0.00, fee_usd: 3.00}
          - {payment_id: in_flight_beats_missing, attempt_status: missing, is_primary_attempt: false}
          - {payment_id: in_flight_beats_missing, attempt_status: in_flight, is_primary_attempt: false}
          - {payment_id: missing_beats_failed, attempt_status: failed, is_primary_attempt: false}
          - {payment_id: missing_beats_failed, attempt_status: missing, is_primary_attempt: false}
          - {payment_id: all_failed, attempt_status: failed, is_primary_attempt: false}
          - {payment_id: all_failed, attempt_status: cancelled, is_primary_attempt: false}
    expect:
      rows:
        - {payment_id: two_delivered, payout_outcome: multiple_delivered, is_delivered_remittance: true, transacted_usd: 103.00, value_sent_usd: 100.00, fee_usd: 3.00, extra_delivered_value_usd: 100.00}
        - {payment_id: no_receipt, payout_outcome: no_receipt, is_delivered_remittance: false, transacted_usd: null, value_sent_usd: null, fee_usd: null, extra_delivered_value_usd: null}
        - {payment_id: failed_paid_out, payout_outcome: delivered, is_delivered_remittance: false, transacted_usd: null, value_sent_usd: 47.00, fee_usd: 3.00, extra_delivered_value_usd: null}
        - {payment_id: in_flight_beats_missing, payout_outcome: in_flight, is_delivered_remittance: false, transacted_usd: null, value_sent_usd: null, fee_usd: null, extra_delivered_value_usd: null}
        - {payment_id: missing_beats_failed, payout_outcome: missing_payout, is_delivered_remittance: false, transacted_usd: null, value_sent_usd: null, fee_usd: null, extra_delivered_value_usd: null}
        - {payment_id: all_failed, payout_outcome: not_delivered, is_delivered_remittance: false, transacted_usd: null, value_sent_usd: null, fee_usd: null, extra_delivered_value_usd: null}

  - name: extract_end_is_the_latest_payment
    model: fct_remittances
    overrides:
      vars:
        transacted_measure: customer_paid_usd
    given:
      - input: ref('stg_payments')
        rows:
          - {payment_id: p1, created_at: '2026-01-01 00:00:00+00'}
          - {payment_id: p2, created_at: '2026-01-03 00:00:00+00'}
      - input: ref('int_payout_attempts')
        rows: []
    expect:
      rows:
        - {payment_id: p1, extract_end_at: '2026-01-03 00:00:00+00'}
        - {payment_id: p2, extract_end_at: '2026-01-03 00:00:00+00'}

  - name: top_class_includes_the_crossing_user
    model: dim_users
    overrides: &dim_vars
      vars:
        recurring_window_days: 90
    given:
      - input: ref('fct_remittances')
        rows:
          - {payment_id: p1, user_id: a, is_delivered_remittance: true, transacted_usd: 40, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: p2, user_id: b, is_delivered_remittance: true, transacted_usd: 30, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: p3, user_id: c, is_delivered_remittance: true, transacted_usd: 20, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: p4, user_id: d, is_delivered_remittance: true, transacted_usd: 10, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: p5, user_id: e, is_delivered_remittance: false, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
      - input: ref('int_user_beneficiaries')
        rows: []
    expect:
      rows:
        - {user_id: a, volume_class: top_50_pct_volume}
        - {user_id: b, volume_class: top_50_pct_volume}
        - {user_id: c, volume_class: long_tail}
        - {user_id: d, volume_class: long_tail}
        - {user_id: e, volume_class: no_delivered_volume}

  - name: user_reaching_exactly_half_is_the_last_one
    model: dim_users
    overrides: *dim_vars
    given:
      - input: ref('fct_remittances')
        rows:
          - {payment_id: p1, user_id: a, is_delivered_remittance: true, transacted_usd: 50, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: p2, user_id: b, is_delivered_remittance: true, transacted_usd: 30, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: p3, user_id: c, is_delivered_remittance: true, transacted_usd: 20, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
      - input: ref('int_user_beneficiaries')
        rows: []
    expect:
      rows:
        - {user_id: a, volume_class: top_50_pct_volume}
        - {user_id: b, volume_class: long_tail}
        - {user_id: c, volume_class: long_tail}

  - name: ties_break_by_user_id
    model: dim_users
    overrides: *dim_vars
    given:
      - input: ref('fct_remittances')
        rows:
          - {payment_id: p1, user_id: d, is_delivered_remittance: true, transacted_usd: 25, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: p2, user_id: c, is_delivered_remittance: true, transacted_usd: 25, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: p3, user_id: b, is_delivered_remittance: true, transacted_usd: 25, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: p4, user_id: a, is_delivered_remittance: true, transacted_usd: 25, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
      - input: ref('int_user_beneficiaries')
        rows: []
    expect:
      rows:
        - {user_id: a, volume_class: top_50_pct_volume}
        - {user_id: b, volume_class: top_50_pct_volume}
        - {user_id: c, volume_class: long_tail}
        - {user_id: d, volume_class: long_tail}

  - name: recurring_needs_a_gap_over_one_day_and_within_the_window
    model: dim_users
    overrides: *dim_vars
    given:
      - input: ref('fct_remittances')
        rows:
          - {payment_id: a1, user_id: one_day, is_delivered_remittance: true, transacted_usd: 1, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: a2, user_id: one_day, is_delivered_remittance: true, transacted_usd: 1, created_at: '2026-01-02 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: b1, user_id: ninety, is_delivered_remittance: true, transacted_usd: 1, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: b2, user_id: ninety, is_delivered_remittance: true, transacted_usd: 1, created_at: '2026-04-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: c1, user_id: ninety_one, is_delivered_remittance: true, transacted_usd: 1, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: c2, user_id: ninety_one, is_delivered_remittance: true, transacted_usd: 1, created_at: '2026-04-02 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: d1, user_id: daily, is_delivered_remittance: true, transacted_usd: 1, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: d2, user_id: daily, is_delivered_remittance: true, transacted_usd: 1, created_at: '2026-01-02 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: d3, user_id: daily, is_delivered_remittance: true, transacted_usd: 1, created_at: '2026-01-03 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
      - input: ref('int_user_beneficiaries')
        rows: []
    expect:
      rows:
        - {user_id: one_day, is_recurring: false}
        - {user_id: ninety, is_recurring: true}
        - {user_id: ninety_one, is_recurring: false}
        - {user_id: daily, is_recurring: false}

  - name: repeat_is_null_without_a_full_window
    model: dim_users
    overrides: *dim_vars
    given:
      - input: ref('fct_remittances')
        rows:
          - {payment_id: a1, user_id: exact_window_repeat, is_delivered_remittance: true, transacted_usd: 1, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-04-01 00:00:00+00'}
          - {payment_id: a2, user_id: exact_window_repeat, is_delivered_remittance: true, transacted_usd: 1, created_at: '2026-02-01 00:00:00+00', extract_end_at: '2026-04-01 00:00:00+00'}
          - {payment_id: b1, user_id: exact_window_no_repeat, is_delivered_remittance: true, transacted_usd: 1, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-04-01 00:00:00+00'}
          - {payment_id: c1, user_id: short_window, is_delivered_remittance: true, transacted_usd: 1, created_at: '2026-01-02 00:00:00+00', extract_end_at: '2026-04-01 00:00:00+00'}
          - {payment_id: c2, user_id: short_window, is_delivered_remittance: true, transacted_usd: 1, created_at: '2026-02-01 00:00:00+00', extract_end_at: '2026-04-01 00:00:00+00'}
      - input: ref('int_user_beneficiaries')
        rows: []
    expect:
      rows:
        - {user_id: exact_window_repeat, repeat_within_window: true}
        - {user_id: exact_window_no_repeat, repeat_within_window: false}
        - {user_id: short_window, repeat_within_window: null}

  - name: retry_only_beneficiary_does_not_count_toward_the_segment
    model: dim_users
    overrides: *dim_vars
    given:
      - input: ref('fct_remittances')
        rows:
          - {payment_id: p1, user_id: a, is_delivered_remittance: true, transacted_usd: 1, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
          - {payment_id: p2, user_id: b, is_delivered_remittance: false, created_at: '2026-01-01 00:00:00+00', extract_end_at: '2026-09-01 00:00:00+00'}
      - input: ref('int_user_beneficiaries')
        rows:
          - {user_id: a, beneficiary_key: b1, is_on_first_attempt: true}
          - {user_id: a, beneficiary_key: b2, is_on_first_attempt: false}
    expect:
      rows:
        - {user_id: a, beneficiary_segment: '1'}
        - {user_id: b, beneficiary_segment: none}

  - name: only_the_month_holding_the_extract_end_is_partial
    model: mart_monthly_volume
    given:
      - input: ref('fct_remittances')
        rows:
          - {payment_id: p1, user_id: a, payment_month: 2026-08-01, is_delivered_remittance: true, is_successful_payment: true, transacted_usd: 10, customer_paid_usd: 10, extract_end_at: '2026-09-22 14:00:00+00'}
          - {payment_id: p2, user_id: a, payment_month: 2026-09-01, is_delivered_remittance: true, is_successful_payment: true, transacted_usd: 10, customer_paid_usd: 10, extract_end_at: '2026-09-22 14:00:00+00'}
    expect:
      rows:
        - {payment_month: 2026-08-01, is_partial_month: false, first_seen_senders: 1, returning_senders: 0}
        - {payment_month: 2026-09-01, is_partial_month: true, first_seen_senders: 0, returning_senders: 1}

  - name: month_matures_exactly_at_the_boundary
    model: mart_chargeback_rate
    overrides:
      vars:
        chargeback_maturity_days: 120
    given:
      - input: ref('fct_remittances')
        rows:
          - {payment_id: p1, payment_month: 2026-04-01, is_chargeback_eligible: true, has_chargeback: false, customer_paid_usd: 10, extract_end_at: '2026-08-28 12:00:00+00'}
          - {payment_id: p2, payment_month: 2026-05-01, is_chargeback_eligible: true, has_chargeback: true, customer_paid_usd: 10, extract_end_at: '2026-08-28 12:00:00+00'}
    expect:
      rows:
        - {payment_month: 2026-04-01, is_mature: true, flagged_payments: 0}
        - {payment_month: 2026-05-01, is_mature: false, flagged_payments: 1}

  - name: provider_classes_at_their_boundaries
    model: mart_provider_failures
    overrides:
      vars:
        provider_class: {low_below: 0.5, medium_below: 0.75, min_attempts: 4}
    given:
      - input: ref('int_payout_attempts')
        rows:
          - {provider: at_low_line, attempt_status: failed, attempt_number: 1, is_followed_by_delivery: false}
          - {provider: at_low_line, attempt_status: failed, attempt_number: 1, is_followed_by_delivery: false}
          - {provider: at_low_line, attempt_status: delivered, attempt_number: 1, is_followed_by_delivery: false}
          - {provider: at_low_line, attempt_status: delivered, attempt_number: 1, is_followed_by_delivery: false}
          - {provider: at_medium_line, attempt_status: failed, attempt_number: 1, is_followed_by_delivery: false}
          - {provider: at_medium_line, attempt_status: failed, attempt_number: 1, is_followed_by_delivery: false}
          - {provider: at_medium_line, attempt_status: failed, attempt_number: 1, is_followed_by_delivery: false}
          - {provider: at_medium_line, attempt_status: delivered, attempt_number: 1, is_followed_by_delivery: false}
          - {provider: too_few, attempt_status: failed, attempt_number: 1, is_followed_by_delivery: false}
          - {provider: too_few, attempt_status: failed, attempt_number: 1, is_followed_by_delivery: false}
          - {provider: too_few, attempt_status: delivered, attempt_number: 1, is_followed_by_delivery: false}
          - {provider: label_sensitive, attempt_status: cancelled, attempt_number: 1, is_followed_by_delivery: false}
          - {provider: label_sensitive, attempt_status: cancelled, attempt_number: 1, is_followed_by_delivery: false}
          - {provider: label_sensitive, attempt_status: cancelled, attempt_number: 1, is_followed_by_delivery: false}
          - {provider: label_sensitive, attempt_status: delivered, attempt_number: 1, is_followed_by_delivery: false}
          - {provider: null, attempt_status: missing, attempt_number: 1, is_followed_by_delivery: false}
    expect:
      rows:
        - {provider: at_low_line, failure_class: medium, unsuccessful_class: medium, is_label_sensitive: false}
        - {provider: at_medium_line, failure_class: high, unsuccessful_class: high, is_label_sensitive: false}
        - {provider: too_few, failure_class: insufficient_volume, unsuccessful_class: insufficient_volume, is_label_sensitive: false}
        - {provider: label_sensitive, failure_class: low, unsuccessful_class: high, is_label_sensitive: true}

  - name: two_users_on_one_key_are_shared_even_on_a_retry
    model: mart_shared_beneficiaries
    given:
      - input: ref('int_user_beneficiaries')
        rows:
          - {user_id: u1, beneficiary_key: shared, is_on_first_attempt: true}
          - {user_id: u2, beneficiary_key: shared, is_on_first_attempt: false}
          - {user_id: u3, beneficiary_key: alone, is_on_first_attempt: true}
    expect:
      rows:
        - {beneficiary_key: shared, users: 2}
