name: remittances
version: "1.0.0"
profile: remittances

models:
  remittances:
    +materialized: table
    +group: remittance_analytics
    staging:
      +access: private
    intermediate:
      +access: private
    marts:
      +access: public

data_tests:
  remittances:
    +group: remittance_analytics

vars:
  data_dir: data

  # Adopted assumptions. See docs/02-assumptions-and-rules.md.
  transacted_measure: customer_paid_usd
  recurring_window_days: 90
  chargeback_maturity_days: 120
  provider_class:
    low_below: 0.01
    medium_below: 0.03
    min_attempts: 1000
